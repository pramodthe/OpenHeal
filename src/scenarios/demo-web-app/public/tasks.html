<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks — OpenHeal Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Tasks</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/tasks.html">Tasks</a>
      </nav>
    </header>
    <main>
      <form id="task-form">
        <label>
          Title
          <input name="title" required placeholder="Buy milk" />
        </label>
        <button type="submit" class="btn broken-submit">Save task</button>
      </form>
      <p class="openheal-bug" hidden>Submit handler not wired — behavioral regression marker</p>
      <ul id="task-list"></ul>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
