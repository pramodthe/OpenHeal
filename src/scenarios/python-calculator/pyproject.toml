[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-calculator"
version = "1.0.0"
description = "Sample broken Python calculator for OpenHeal benchmark"
dependencies = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
include = ["calculator*"]

